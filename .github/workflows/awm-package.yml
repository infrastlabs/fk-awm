# awm 三架构出包 workflow（gh actions 语法）
# 方案：docs/sam/2026-10-19-actions.md（第三章）
# 逻辑在 .github/scripts/buildx.sh + Dockerfile；本文件只做编排。
name: awm-package

on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  WS: .github/workflows/.ws
  NS: infrastlabs
  REPO_HUB: registry.cn-shenzhen.aliyuncs.com
  IMG: x11-base:awm

jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git describe 全历史（§3.6）

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v2
        with:
          platforms: arm,arm64

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v2
        with:
          driver: docker-container

      - name: Login registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REPO_HUB }}
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_PW }}

      - name: Prepare 03 sources (dbus/lua/xdg)
        run: |
          mkdir -p "$WS/mat"
          curl -sSLo "$WS/mat/dbus-1.12.26.tar.gz" https://dbus.freedesktop.org/releases/dbus/dbus-1.12.26.tar.gz
          curl -sSLo "$WS/mat/lua-5.3.6.tar.gz" https://www.lua.org/ftp/lua-5.3.6.tar.gz
          git clone --depth=1 https://github.com/davmac314/libxdg-basedir "$WS/mat/libxdg-basedir"

      - name: Build + extract (buildx.sh)
        run: |
          bash .github/scripts/buildx.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: awm-static-musl
          path: ${{ env.WS }}/pkgs/awm-static-musl-*.tar.gz
          if-no-files-found: error

      - name: Attach to release (only on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.WS }}/pkgs/awm-static-musl-*.tar.gz
          fail_on_unmatched_files: false
