# awm 三架构出包 workflow（gh actions 语法）
# 方案：docs/sam/2026-10-19-actions.md（第三章）
# 逻辑在 .github/buildx.sh + Dockerfile；本文件只做编排。
name: awm-package

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [ "dev", "sam-custom" , "feat/ai-*" ]
env:
  WS: .github/workflows/.ws
  NS: infrastlabs

permissions:
  contents: write  # gh-release attach 需要（默认 read 会失败）

jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git describe 全历史（§3.6）

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v2
        with:
          platforms: arm,arm64

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v2
        with:
          driver: docker-container

      - name: Auth + Build + extract (x11base 同款)
        run: |
          # ENV（照抄 x11base workflow）
          export DOCKER_REGISTRY_USER_dockerhub=${{ secrets.DOCKER_REGISTRY_USER_DOCKERHUB }}
          export DOCKER_REGISTRY_PW_dockerhub=${{ secrets.DOCKER_REGISTRY_PW_DOCKERHUB }}
          export DOCKER_REGISTRY_USER_infrastSubUser2=${{ secrets.DOCKER_REGISTRY_USER_INFRASTSUBUSER2 }}
          export DOCKER_REGISTRY_PW_infrastSubUser2=${{ secrets.DOCKER_REGISTRY_PW_INFRASTSUBUSER2 }}
          export DOCKER_REGISTRY_TENCLOUD_USER=${{ secrets.DOCKER_REGISTRY_TENCLOUD_USER }}
          export DOCKER_REGISTRY_TENCLOUD_PASS=${{ secrets.DOCKER_REGISTRY_TENCLOUD_PASS }}
          export REPO_HUB=registry-1.docker.io
          export REPO_ALI=registry.cn-shenzhen.aliyuncs.com
          export REPO_TEN=ccr.ccs.tencentyun.com
          export REPO_TEN_HK=hkccr.ccs.tencentyun.com
          export REPO=$REPO_ALI
          # login（ali + dockerhub + ten_hk）
          echo "${DOCKER_REGISTRY_PW_infrastSubUser2}" | docker login --username=${DOCKER_REGISTRY_USER_infrastSubUser2} --password-stdin $REPO_ALI
          echo "${DOCKER_REGISTRY_PW_dockerhub}" | docker login --username=${DOCKER_REGISTRY_USER_dockerhub} --password-stdin $REPO_HUB
          echo "${DOCKER_REGISTRY_TENCLOUD_PASS}" | docker login --username=${DOCKER_REGISTRY_TENCLOUD_USER} --password-stdin $REPO_TEN_HK
          # build + undock 取物
          bash .github/buildx.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: awm-static-musl
          path: ${{ env.WS }}/pkgs/awm-static-musl-*.tar.gz
          if-no-files-found: error

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          name: v2610
          tag_name: v2610
          make_latest: true
          token: ${{ github.token }}
          body: |
            Automated release v2610 for ${{ github.ref }}
          draft: false
          prerelease: false
          preserve_order: true
          fail_on_unmatched_files: false
          files: ${{ env.WS }}/pkgs/awm-static-musl-*.tar.gz
